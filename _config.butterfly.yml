# Minimal overrides merged with Butterfly 5.7.0 defaults.
# Never edit node_modules or theme core files for customization.
nav:
  display_title: true
  display_post_title: false
  fixed: true
menu:
  Writing: /archives/
  Projects: /projects/
  Categories: /categories/
  About: /about/
favicon: /assets/site/favicon.svg
avatar:
  img: /assets/site/favicon.svg
  effect: false
disable_top_img: true
cover:
  index_enable: false
  aside_enable: false
  archives_enable: false
subtitle:
  enable: false
  effect: false
index_layout: 1
index_post_content:
  method: 2
  length: 160
toc:
  post: true
  page: false
  number: false
  expand: true
  style_simple: true
  scroll_percent: false
# A content license can be chosen later; do not silently assign a CC license.
post_copyright:
  enable: false
related_post:
  enable: false
reward:
  enable: false
aside:
  enable: true
  hide: false
  button: false
  mobile: true
  card_author:
    enable: false
    button:
      enable: false
  card_announcement:
    enable: false
  card_recent_post:
    enable: false
  card_categories:
    enable: false
  card_tags:
    enable: false
  card_archives:
    enable: false
  card_post_series:
    enable: false
  card_webinfo:
    enable: false
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: '<a href="https://github.com/jerryma0622-lgtm" target="_blank" rel="noopener">GitHub</a>'
darkmode:
  enable: true
  button: true
  autoChangeMode: false
display_mode: light
readmode: false
rightside_item_order:
  enable: true
  hide: readmode
  show: darkmode,toc
rightside_config_animation: false
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
share:
  use: ''
comments:
  use: ''
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false
enter_transitions: false
hr_icon:
  enable: false
lightbox: ''
instantpage: false
theme_color:
  enable: true
  main: '#365bc0'
  paginator: '#365bc0'
  button_hover: '#29469a'
  text_selection: '#365bc0'
  link_color: '#365bc0'
  toc_color: '#365bc0'
  scrollbar_color: '#667785'
font:
  global_font_size: 16px
  code_font_size: 14px
  font_family: 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif'
  code_font_family: '"Cascadia Code", "SFMono-Regular", Consolas, monospace'
inject:
  head:
    - '<link rel="stylesheet" href="/css/custom.css">'
    - '<script defer src="/js/accessibility.js"></script>'
    - '<script defer src="/js/presentation.js"></script>'
  bottom: []
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: true
  option:
    # The only enabled external library is served locally by scripts/vendor.js.
    fontawesome: /vendor/fontawesome/css/all.min.css
