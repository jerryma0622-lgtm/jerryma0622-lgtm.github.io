# Hexo site configuration. Theme overrides live in _config.butterfly.yml.
title: "Jerry's Blog"
subtitle: "技术博客 · 数字花园 · 个人主页"
description: "Jerry 的技术实践、项目记录与生活随记。"
author: Jerry
language: zh-CN
timezone: Asia/Shanghai
url: https://jerryma0622-lgtm.github.io
root: /
permalink: posts/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
skip_render:
  - assets/**
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
filename_case: 1
render_drafts: false
post_asset_folder: false
relative_link: false
marked:
  # Preserve source-relative URLs for scripts/asset-links.js and Obsidian.
  prependRoot: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  wrap: true
  hljs: false
index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: 随记
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: date
per_page: 10
pagination_dir: page
exclude:
  - '**/.gitkeep'
theme: butterfly
deploy:
  type: ''
# Search contains published articles only, no project documentation or drafts.
search:
  path: search.xml
  field: post
  content: true
